name: Windows

# Tests, parcours de l interface, programme d installation. Le dernier job publie
# le programme d installation sur la page Releases, une fois TOUT le reste vert :
# sur une etiquette v<version>, ou sur un envoi dont le message de commit contient
# [publier]. Le fichier publie est celui qui vient d etre installe et teste.

on:
  push:
    branches: [ main, 'claude/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.shell }})
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [ pwsh, powershell ]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Pester
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -MinimumVersion 5.0
          $config = New-PesterConfiguration
          $config.Run.Path = '.\Tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
      - name: Coherence des versions et masquage de parametres
        run: |
          $ErrorActionPreference = 'Stop'
          .\Tests\Test-VersionConsistency.ps1
          .\Tests\Test-ParameterShadowing.ps1

  interface:
    name: Interface (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-2022, windows-2025 ]
    steps:
      - uses: actions/checkout@v4
      - name: Installer GliderUI et son serveur
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-PSResource -Name GliderUI -Version 0.4.1 -TrustRepository -Scope CurrentUser
          Import-Module GliderUI -RequiredVersion 0.4.1
          Install-GLIServer -TrustRepository
      - name: Parcours de l interface (annuaire simule)
        shell: pwsh
        timeout-minutes: 15
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'interface'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          pwsh -NoProfile -File .\Start-PSADToolkit.ps1 -SmokeTest -GliderUIVersion 0.4.1 -SmokeReportPath (Join-Path $out 'rapport.json')
          $code = $LASTEXITCODE
          $reportPath = Join-Path $out 'rapport.json'
          if (-not (Test-Path $reportPath)) { throw 'Aucun rapport produit.' }
          $report = Get-Content -Raw $reportPath | ConvertFrom-Json
          if (-not $report.Passed) { throw 'Test de fumee en echec : voir le rapport ci-dessus.' }
          if ($code) { throw ('Code de sortie {0}.' -f $code) }
      - name: Captures et rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-${{ matrix.os }}
          path: ${{ runner.temp }}/interface
          if-no-files-found: warn

  installateur:
    name: Programme d installation
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Construire PSADToolkit.exe et le programme d installation
        shell: pwsh
        run: .\installer\Build-Installer.ps1 -OutputDirectory "$env:RUNNER_TEMP\setup"
      - name: Programme d installation (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: PSADToolkit-Setup
          path: ${{ runner.temp }}/setup/*.exe
          if-no-files-found: error
      - name: Installer, lancer, desinstaller
        shell: powershell
        run: |
          $setup = (Get-ChildItem "$env:RUNNER_TEMP\setup\*.exe" | Select-Object -First 1).FullName
          .\Tests\CI\Test-Installer.ps1 -Setup $setup -Repository $PWD.Path -OutputFolder "$env:RUNNER_TEMP\installation"
      - name: Journaux et captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installation-windows-2022
          path: ${{ runner.temp }}/installation
          if-no-files-found: warn

  poste-sans-powershell7:
    name: Installation sur un poste sans PowerShell 7
    needs: installateur
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PSADToolkit-Setup
          path: ${{ runner.temp }}/setup
      - name: Desinstaller PowerShell 7 et GliderUI
        shell: powershell
        run: |
          $keys = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          $entries = @(Get-ItemProperty $keys -ErrorAction SilentlyContinue | Where-Object { [string]$_.DisplayName -like 'PowerShell 7*' })
          foreach ($entry in $entries) {
            Write-Output ('Desinstallation : ' + $entry.DisplayName + ' ' + $entry.PSChildName)
            $process = Start-Process msiexec.exe -ArgumentList '/x', $entry.PSChildName, '/qn', '/norestart' -Wait -PassThru
            Write-Output ('  code ' + $process.ExitCode)
          }
          Remove-Item "$env:ProgramFiles\PowerShell\7" -Recurse -Force -ErrorAction SilentlyContinue
          foreach ($folder in @("$env:ProgramFiles\PowerShell\Modules", "$HOME\Documents\PowerShell\Modules")) {
            Get-ChildItem $folder -Directory -Filter 'GliderUI*' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force
          }
          Get-Command pwsh.exe -All -ErrorAction SilentlyContinue | ForEach-Object { Write-Output ('Encore present : ' + $_.Source) }
      - name: Installer, lancer, desinstaller
        shell: powershell
        run: |
          $setup = (Get-ChildItem "$env:RUNNER_TEMP\setup\*.exe" | Select-Object -First 1).FullName
          .\Tests\CI\Test-Installer.ps1 -Setup $setup -Repository $PWD.Path -OutputFolder "$env:RUNNER_TEMP\installation" -ExpectPowerShellInstall
      - name: Journaux et captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installation-sans-powershell7
          path: ${{ runner.temp }}/installation
          if-no-files-found: warn

  publication:
    name: Publication sur la page Releases
    needs: [ tests, interface, installateur, poste-sans-powershell7 ]
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[publier]'))
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PSADToolkit-Setup
          path: ${{ runner.temp }}/setup
      - name: Version et notes
        id: version
        shell: pwsh
        run: |
          $manifest = Import-PowerShellDataFile .\PSADToolkit.psd1
          $channel = [string]$manifest.PrivateData.PSData.Prerelease
          $version = [string]$manifest.ModuleVersion
          if ($channel) { $version += '-' + $channel }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne ('v' + $version)) {
            throw ('Etiquette {0} differente de la version du manifeste {1}.' -f $env:GITHUB_REF_NAME, $version)
          }
          $setup = Get-Item ("$env:RUNNER_TEMP\setup\PSADToolkit-Setup-{0}.exe" -f $version)
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash
          ('{0}  {1}' -f $hash, $setup.Name) | Set-Content "$env:RUNNER_TEMP\setup\SHA256SUMS.txt" -Encoding ascii

          # Section du CHANGELOG de cette version.
          $changelog = Get-Content -Raw .\CHANGELOG.md
          $pattern = '(?ms)^## ' + [regex]::Escape($version) + '\b[^\n]*\n(.*?)(?=^## |\z)'
          $section = [regex]::Match($changelog, $pattern).Groups[1].Value.Trim()
          $url = 'https://github.com/{0}/releases/download/v{1}/{2}' -f $env:GITHUB_REPOSITORY, $version, $setup.Name
          $notes = @(
            '## Telecharger'
            ''
            ('**[{0}]({1})** ({2:N0} Mo)' -f $setup.Name, $url, ($setup.Length / 1MB))
            ''
            '## Installer'
            ''
            '1. Executer le fichier avec un compte administrateur du poste : licence, dossier d installation, raccourcis.'
            '2. Ouvrir **PSADToolkit** depuis le menu Demarrer, puis choisir le domaine a gerer.'
            ''
            'PowerShell 7 et GliderUI sont inclus : aucun acces a Internet n est necessaire pour installer. Ils sont ensuite tenus a jour automatiquement.'
            ''
            'Windows 10 1607, Windows 11 ou Windows Server 2016 a 2025. Le programme n est pas signe : SmartScreen peut demander **Informations complementaires > Executer quand meme**.'
            ''
            ('SHA256 : `{0}`' -f $hash)
            ''
            '## Changements'
            ''
            $section
          )
          $notes -join "`n" | Set-Content "$env:RUNNER_TEMP\notes.md" -Encoding utf8
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$(([bool]$channel).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "setup=$($setup.FullName)" >> $env:GITHUB_OUTPUT
      - name: Publier
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          SETUP: ${{ steps.version.outputs.setup }}
        run: |
          $tag = 'v' + $env:VERSION
          $files = @($env:SETUP, "$env:RUNNER_TEMP\setup\SHA256SUMS.txt")
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            # Meme version republiee : remplacer les fichiers et les notes.
            gh release upload $tag @files --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE) { throw 'Envoi des fichiers en echec.' }
            gh release edit $tag --notes-file "$env:RUNNER_TEMP\notes.md" --repo $env:GITHUB_REPOSITORY
          } else {
            $options = @('--title', ('PSADToolkit ' + $env:VERSION), '--notes-file', "$env:RUNNER_TEMP\notes.md", '--target', $env:GITHUB_SHA)
            if ($env:PRERELEASE -eq 'true') { $options += '--prerelease' }
            gh release create $tag @files @options --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE) { throw 'Publication en echec.' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json url,assets --jq '.url, (.assets[] | .name + "  " + .url)'
