name: Sonde runner Windows (temporaire)
on:
  push:
    branches: [ 'claude/**' ]
    paths: [ 'Tests/CI/Probe-Runner.ps1', '.github/workflows/sonde.yml' ]
jobs:
  sonde:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Sonde - installation
        shell: pwsh
        timeout-minutes: 8
        run: ./Tests/CI/Probe-Runner.ps1 -Phase Install
      - name: Sonde - interface (processus neuf)
        shell: pwsh
        timeout-minutes: 8
        run: ./Tests/CI/Probe-Runner.ps1 -Phase Ui
